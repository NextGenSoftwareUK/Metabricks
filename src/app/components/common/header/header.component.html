<!-- src/app/components/common/header/header.component.html -->
<header class="header-component">
    <!-- Header Content: Title, Logo, Connect Wallet -->
    <div class="header-content">
        <!-- Left: MetaBricks Title -->
        <div class="logo-text" (click)="goHome()" style="cursor: pointer;">
            <h1>METABRiCKS</h1>
        </div>
        
        <!-- Center: Brick Logo -->
        <div class="center-logo" (click)="goHome()" style="cursor: pointer;">
            <img src="/assets/images/logo.png" alt="">
        </div>
        
        <!-- Right: Desktop Navigation and Connect Wallet -->
        <div class="desktop-connect-wallet-section">
            <!-- Desktop Navigation Buttons -->
            <div class="desktop-nav-buttons">
                <button class="nav-btn" routerLink="gallery">Gallery</button>
                <button class="nav-btn" routerLink="hall-of-fame">Hall of Fame</button>
                <button class="nav-btn" routerLink="/wallet">Metabricks Wallet</button>
                <button class="nav-btn admin-btn" routerLink="admin/site-config">Admin</button>
            </div>
            
            <!-- Wallet Connection Button -->
            <button 
                class="desktop-connect-wallet-btn" 
                (click)="connectWallet()"
                [class.connected]="walletAddress">
                <span *ngIf="!walletAddress">Connect Wallet</span>
                <span *ngIf="walletAddress">
                    {{ walletAddress | slice:0:6 }}...{{ walletAddress | slice:-4 }}
                </span>
            </button>
        </div>
        
        <!-- Mobile Connect Wallet Button Only -->
        <div class="mobile-connect-wallet-section">
            <button 
                class="mobile-connect-wallet-btn" 
                (click)="connectWallet()"
                [class.connected]="walletAddress">
                <span *ngIf="!walletAddress">🔗 Wallet</span>
                <span *ngIf="walletAddress">💰 {{ walletAddress | slice:0:4 }}...</span>
            </button>
        </div>
    </div>
</header>

<!-- Hamburger Menu - Only for Mobile -->
<div class="hamburger-menu">
    <button class="hamburger-toggle" (click)="toggleHamburgerMenu()">
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
        <span class="hamburger-line"></span>
    </button>
    
    <div class="hamburger-content" [class.open]="isHamburgerOpen">
        <button class="hamburger-nav-btn" routerLink="gallery">Gallery</button>
        <button class="hamburger-nav-btn" routerLink="hall-of-fame">Hall of Fame</button>
        <button class="hamburger-nav-btn" routerLink="/wallet">Metabricks Wallet</button>
        <button class="hamburger-nav-btn admin-btn" routerLink="admin/site-config">🔧 Admin</button>
    </div>
</div>

<!-- Wallet Connection Modal -->
<div class="wallet-modal" [class.show]="showWalletModal">
    <div class="wallet-modal-content">
        <div class="wallet-modal-header">
            <h3>🔗 Connect Your Wallet</h3>
            <button class="wallet-modal-close" (click)="closeWalletModal()">&times;</button>
        </div>
        
        <div class="wallet-modal-body">
            <!-- Connected Wallet Display -->
            <div *ngIf="walletAddress" class="connected-wallet">
                <div class="wallet-info-display">
                    <span class="wallet-icon">💰</span>
                    <div class="wallet-details">
                        <h4>Connected Wallet</h4>
                        <p class="wallet-address">{{ walletAddress }}</p>
                    </div>
                </div>
                <button class="disconnect-btn" (click)="walletAddress = null">
                    🔌 Disconnect
                </button>
            </div>
            
            <!-- Wallet Connection Options -->
            <div *ngIf="!walletAddress">
                <p class="wallet-description">
                    Connect your wallet to mint MetaBricks NFTs and manage your collection.
                </p>
                
                <div class="wallet-options">
                    <!-- Phantom Wallet -->
                    <button 
                        class="wallet-option phantom-wallet" 
                        (click)="connectWallet()"
                        [disabled]="isConnecting">
                        <div class="wallet-icon">
                            <img src="/assets/images/phantom-logo.png" alt="Phantom" class="wallet-logo" />
                        </div>
                        <div class="wallet-info">
                            <h4>Phantom</h4>
                            <p>Solana Wallet</p>
                        </div>
                        <div class="wallet-status">
                            <span *ngIf="!isConnecting">→</span>
                            <span *ngIf="isConnecting" class="loading-spinner">⟳</span>
                        </div>
                    </button>
                    
                    <!-- MetaMask Wallet -->
                    <button 
                        class="wallet-option metamask-wallet" 
                        (click)="connectWallet()"
                        [disabled]="isConnecting">
                        <div class="wallet-icon">
                            <img src="/assets/images/MetaMask_Fox.svg (1).png" alt="MetaMask" class="wallet-logo" />
                        </div>
                        <div class="wallet-info">
                            <h4>MetaMask</h4>
                            <p>Ethereum Wallet</p>
                        </div>
                        <div class="wallet-status">
                            <span *ngIf="!isConnecting">→</span>
                            <span *ngIf="isConnecting" class="loading-spinner">⟳</span>
                        </div>
                    </button>
                </div>
                
                <div class="wallet-help">
                    <p><strong>Don't have a wallet?</strong></p>
                    <a href="https://phantom.app/" target="_blank" class="wallet-link">Get Phantom</a>
                    <span class="separator">|</span>
                    <a href="https://metamask.io/" target="_blank" class="wallet-link">Get MetaMask</a>
                </div>
            </div>
        </div>
        
        <!-- Connection Status -->
        <div *ngIf="connectionStatus" class="connection-status" [class]="connectionStatus.type">
            <span class="status-icon">{{ connectionStatus.icon }}</span>
            <span class="status-message">{{ connectionStatus.message }}</span>
        </div>
    </div>
</div>
