<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>MetaBricks</title>
  <base href="/">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  
  <!-- Mobile-specific meta tags to prevent flickering -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#343BE6">
  
  <!-- Prevent mobile zoom and flickering -->
  <meta name="format-detection" content="telephone=no">
  <meta name="msapplication-tap-highlight" content="no">
  
  <!-- Basic security meta tags -->
  <meta http-equiv="X-Content-Type-Options" content="nosniff">
  <meta name="robots" content="index, follow">
  
  <!-- Favicon -->
  <link rel="icon" type="image/png" href="assets/images/handbrick.png">
  <link rel="icon" type="image/x-icon" href="favicon.ico">
  
  <!-- Open Graph Metadata for Link Sharing -->
  <meta property="og:title" content="MetaBricks - Construction Site for the Operating Systems of the Future">
  <meta property="og:description" content="Greetings, builder. This is not a normal NFT project. This is a construction site for the operating systems of the future. Your assignment is to hodl bricks and help us finish building the Metaverse. Every brick includes guaranteed perks: OASIS API access, Our World benefits, AR experiences, and more. Join the revolution building a stable, resilient, decentralized platform for the sovereign metaverse.">
  <meta property="og:image" content="assets/images/handbrick.png">
  <meta property="og:url" content="">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="MetaBricks">
  
  <!-- Twitter Card Metadata -->
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="MetaBricks - Construction Site for the Operating Systems of the Future">
  <meta name="twitter:description" content="Greetings, builder. This is not a normal NFT project. This is a construction site for the operating systems of the future. Your assignment is to hodl bricks and help us finish building the Metaverse. Every brick includes guaranteed perks: OASIS API access, Our World benefits, AR experiences, and more. Join the revolution building a stable, resilient, decentralized platform for the sovereign metaverse.">
  <meta name="twitter:image" content="assets/images/handbrick.png">
  
  <!-- Styles -->
  <!-- Angular CLI will automatically inject the correct stylesheet -->
  <style>
    /* Prevent flash of unstyled content */
    body { 
      background: #343BE6 !important; 
      font-family: 'Mek Sans Regular', sans-serif !important;
      color: #b0ffec !important;
      margin: 0;
      padding: 0;
      /* Mobile-specific fixes */
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      -khtml-user-select: none;
      -moz-user-select: none;
      -ms-user-select: none;
      user-select: none;
      /* Prevent mobile scrolling issues */
      overflow-x: hidden;
      position: relative;
    }
    * { 
      box-sizing: border-box; 
    }
    
    /* Mobile-specific anti-flicker styles */
    @media (max-width: 768px) {
      body {
        /* Prevent mobile flickering */
        -webkit-transform: translateZ(0);
        transform: translateZ(0);
        -webkit-backface-visibility: hidden;
        backface-visibility: hidden;
        -webkit-perspective: 1000;
        perspective: 1000;
        /* Smooth scrolling */
        -webkit-overflow-scrolling: touch;
        /* Prevent bounce scrolling on iOS */
        overscroll-behavior: none;
      }
      
      /* Prevent mobile zoom on input focus */
      input, textarea, select {
        font-size: 16px !important;
      }
      
      /* Smooth transitions */
      * {
        -webkit-transition: none !important;
        -moz-transition: none !important;
        -o-transition: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>
  <app-root></app-root>
</body>
</html>
